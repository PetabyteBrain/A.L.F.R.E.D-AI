# Tool registry — the only place you edit to give Alfred a new capability.
#
# Roles: admin (everything) > cofounder (everything except managing n8n workflows)
#        > friend (basic tools only).
#
# Each tool is exposed to Claude only for the roles listed under `roles`
# ("*" = every role). Role checks happen twice: when the tool list is built
# for a request, and again right before execution.
#
# kinds:
#   builtin      -> python handler in orchestrator/tools/builtin.py (`handler:` name)
#   n8n_api      -> n8n public REST API call (`action:` see orchestrator/tools/n8n_tool.py)
#   n8n_webhook  -> POST to {N8N_BASE_URL}/webhook/<webhook_path>
#                   async: true  -> fire-and-forget; n8n POSTs the result to /n8n/callback later
#                   async: false -> wait for the webhook's response (keep these fast)
#
# Adding an n8n-backed feature = build the workflow in n8n (Webhook trigger) + add one entry here.

tools:
  # ---------------------------------------------------------------- builtin
  - name: current_time
    kind: builtin
    handler: current_time
    roles: ["*"]
    description: Get the current date and time in Alfred's configured timezone.
    input_schema:
      type: object
      properties: {}

  - name: list_tasks
    kind: builtin
    handler: list_tasks
    roles: ["*"]
    description: >-
      List open tasks (with ids, owner, due time, follow-up state) the person owns or asked for, the
      shared list, and (for admins) active n8n workflows.
    input_schema:
      type: object
      properties:
        include_finished: {type: boolean}

  - name: add_task
    kind: builtin
    handler: add_task
    roles: ["*"]
    description: >-
      Add a task, optionally for someone else (admins/cofounders), with a due time and a follow-up:
      at the due time Alfred asks the owner whether it's done (telegram = message with Done / Not yet
      buttons, call = phone call), repeats daily up to 3 times, and reports back to whoever asked.
      E.g. "ask Max to send the invoice by Friday noon and follow up". Resolve relative times first.
    input_schema:
      type: object
      properties:
        title: {type: string, description: What has to be done, phrased as the task.}
        person: {type: string, description: "Owner's name or id; omit for the requester."}
        due: {type: string, description: "ISO 8601 local due time, e.g. 2026-10-02T12:00."}
        follow_up: {type: string, enum: [none, telegram, call], description: "Default: telegram if a due time is given, else none."}
        notes: {type: string, description: Optional detail for the owner.}
      required: [title]

  - name: complete_task
    kind: builtin
    handler: complete_task
    roles: ["*"]
    description: Mark a task done (by id), with an optional result; the requester is told.
    input_schema:
      type: object
      properties:
        task_id: {type: integer}
        result: {type: string, description: "Optional outcome, e.g. 'Invoice sent to the client at 11:40.'"}
      required: [task_id]

  - name: update_task
    kind: builtin
    handler: update_task
    roles: ["*"]
    description: >-
      Change a task (new due time restarts the follow-ups; a new owner; follow-up kind; title), say
      it isn't done yet (action not_yet: asks again tomorrow and tells the requester), or cancel it.
    input_schema:
      type: object
      properties:
        task_id: {type: integer}
        action: {type: string, enum: [update, not_yet, cancel], description: Default update.}
        due: {type: string, description: ISO 8601 local time.}
        person: {type: string, description: New owner's name or id.}
        follow_up: {type: string, enum: [none, telegram, call]}
        title: {type: string}
      required: [task_id]

  - name: list_active_sessions
    kind: builtin
    handler: list_active_sessions
    roles: [admin, cofounder]
    description: List calls and chats currently in progress, with who they are with.
    input_schema:
      type: object
      properties: {}

  - name: recent_activity
    kind: builtin
    handler: recent_activity
    roles: [admin, cofounder]
    description: Recent activity across all users (messages, calls, tool calls, blocked access attempts).
    input_schema:
      type: object
      properties:
        limit: {type: integer, description: "How many entries (default 15, max 50)."}

  - name: list_people
    kind: builtin
    handler: list_people
    roles: [admin, cofounder]
    description: List registered people (id, name, role, which channels they are reachable on).
    input_schema:
      type: object
      properties: {}

  - name: send_telegram_message
    kind: builtin
    handler: send_telegram_message
    roles: [admin, cofounder]
    description: Send a Telegram message to a registered person (by user id from list_people).
    input_schema:
      type: object
      properties:
        user_id: {type: integer}
        text: {type: string}
      required: [user_id, text]

  - name: place_call
    kind: builtin
    handler: place_call
    roles: [admin, cofounder]
    description: >-
      Phone a registered person RIGHT NOW from Alfred's number. Use `purpose` to say what to ask
      or tell them; Alfred then runs that call on the requester's behalf, hangs up when done and
      reports the answer back to the requester (Telegram + dashboard). Use it for the requester
      themselves too ("call me").
    input_schema:
      type: object
      properties:
        person: {type: string, description: "Registered person's name, first name, or user id."}
        purpose: {type: string, description: "What to ask or tell them, e.g. 'Ask whether he can send the invoice by Friday.'"}
        opening_line: {type: string, description: Optional first sentence; a polite default is used otherwise.}
        urgent: {type: boolean, description: "Only when the requester says it's urgent: rings even during the person's quiet hours."}
      required: [person]

  - name: schedule_call
    kind: builtin
    handler: schedule_call
    roles: [admin, cofounder]
    description: >-
      Schedule a phone call to a registered person at a future time (up to 60 days ahead), e.g.
      "call Max tomorrow at 9 and ask about the meeting" or "call me at 18:00 to remind me to
      water the plants". Resolve relative times against the current local time first and pass an
      ISO 8601 local time. The requester gets the outcome reported back afterwards; unanswered
      calls are retried twice, 10 minutes apart.
    input_schema:
      type: object
      properties:
        person: {type: string, description: "Registered person's name, first name, or user id."}
        when: {type: string, description: "ISO 8601 local time, e.g. 2026-09-30T18:30 (Europe/Zurich unless an offset is given)."}
        purpose: {type: string, description: What to ask, tell or remind them about.}
        opening_line: {type: string, description: Optional first sentence.}
      required: [person, when, purpose]

  - name: list_scheduled_calls
    kind: builtin
    handler: list_scheduled_calls
    roles: [admin, cofounder]
    description: List upcoming (and optionally finished) call requests, with their outcomes.
    input_schema:
      type: object
      properties:
        include_finished: {type: boolean}

  - name: cancel_scheduled_call
    kind: builtin
    handler: cancel_scheduled_call
    roles: [admin, cofounder]
    description: Cancel a pending scheduled call by its request id (from list_scheduled_calls).
    input_schema:
      type: object
      properties:
        request_id: {type: integer}
      required: [request_id]

  - name: set_reminder
    kind: builtin
    handler: set_reminder
    roles: ["*"]
    description: >-
      Set a reminder: "remind me at 17:00 to call the bank", "every weekday at 8:30 remind me to
      take my pills". Delivered on Telegram with Done/Snooze buttons (or by phone with
      channel=call). escalate=true phones them if the Telegram reminder isn't acknowledged within
      10 minutes. Resolve relative times against the current local time and pass ISO local time.
      Admins and cofounders can also set reminders for other registered people.
    input_schema:
      type: object
      properties:
        text: {type: string, description: What to remind them about, phrased as the reminder itself.}
        when: {type: string, description: "ISO 8601 local time of the (first) reminder, e.g. 2026-10-01T17:00."}
        recurrence: {type: string, enum: [none, daily, weekdays, weekly, monthly]}
        channel: {type: string, enum: [telegram, call], description: Default telegram.}
        escalate: {type: boolean, description: Phone them if the Telegram reminder isn't acknowledged in 10 minutes.}
        person: {type: string, description: "Someone else's name or id; omit for the requester."}
      required: [text, when]

  - name: list_reminders
    kind: builtin
    handler: list_reminders
    roles: ["*"]
    description: List open reminders (the person's own and those they set for others), with ids.
    input_schema:
      type: object
      properties:
        include_finished: {type: boolean}

  - name: update_reminder
    kind: builtin
    handler: update_reminder
    roles: ["*"]
    description: >-
      Mark a reminder done, snooze it (snooze_minutes), or cancel it (and so end its series), by
      id from list_reminders.
    input_schema:
      type: object
      properties:
        reminder_id: {type: integer}
        action: {type: string, enum: [done, snooze, cancel]}
        snooze_minutes: {type: integer, description: "For snooze; default 10."}
      required: [reminder_id, action]

  - name: get_briefing
    kind: builtin
    handler: get_briefing
    roles: ["*"]
    description: >-
      Today's facts for the person: weather (if a town is set), today's calendar, reminders, planned
      calls, recent call outcomes, open tasks (and failed n8n runs for admins). Use it for "what's my
      day like", "give me my briefing", "anything I should know today".
    input_schema:
      type: object
      properties: {}

  - name: configure_briefing
    kind: builtin
    handler: configure_briefing
    roles: ["*"]
    description: >-
      Turn the person's automatic daily briefing on or off, or change its time (HH:MM local),
      days (daily or weekdays), delivery (telegram or call) or weather town. Only pass what changes.
    input_schema:
      type: object
      properties:
        enabled: {type: boolean}
        time: {type: string, description: "HH:MM local time, e.g. 07:30"}
        days: {type: string, enum: [daily, weekdays]}
        channel: {type: string, enum: [telegram, call]}
        location: {type: string, description: "Town for the weather, e.g. Lucerne; empty string removes it."}

  - name: remember
    kind: builtin
    handler: remember
    roles: ["*"]
    description: >-
      Save a short long-term note for the current person (a preference, routine, key person or
      date). It will be in your context in all their future conversations. Not for secrets.
    input_schema:
      type: object
      properties:
        text: {type: string, description: "One short factual note, e.g. 'Prefers calls after 9:00.'"}
      required: [text]

  - name: update_memory
    kind: builtin
    handler: update_memory
    roles: ["*"]
    description: Replace the text of one of the current person's notes (id shown in your notes).
    input_schema:
      type: object
      properties:
        memory_id: {type: integer}
        text: {type: string}
      required: [memory_id, text]

  - name: forget_memory
    kind: builtin
    handler: forget_memory
    roles: ["*"]
    description: Delete one of the current person's notes (id shown in your notes).
    input_schema:
      type: object
      properties:
        memory_id: {type: integer}
      required: [memory_id]

  - name: configure_quiet_hours
    kind: builtin
    handler: configure_quiet_hours
    roles: ["*"]
    description: >-
      Show or change the current person's quiet hours (when calls others ask for wait and messages
      arrive silently). mode: default (the household default), custom (with start/end HH:MM), off.
      Call without arguments to just read the current setting.
    input_schema:
      type: object
      properties:
        mode: {type: string, enum: [default, custom, "off"]}
        start: {type: string, description: "HH:MM local, for custom"}
        end: {type: string, description: "HH:MM local, for custom"}

  - name: end_call
    kind: builtin
    handler: end_call
    roles: ["*"]
    channels: [call]
    description: >-
      Hang up the current phone call after your reply. Use it once the purpose of an outbound call
      is done, or when the caller says goodbye. Your reply in the same turn should be the goodbye.
    input_schema:
      type: object
      properties: {}

  # ---------------------------------------------------------------- Google Calendar
  # Only offered to a person who has linked their own calendar (Profile tab); each person's
  # tools only ever touch their own calendar.
  - name: calendar_list_events
    kind: builtin
    handler: calendar_list_events
    requires: google
    roles: ["*"]
    description: >-
      List events on the current person's own Google Calendar between two times. Use for
      "what's on my calendar", free/busy questions, and before creating or moving events.
    input_schema:
      type: object
      properties:
        start: {type: string, description: "ISO 8601 date or local datetime, e.g. 2026-10-01 or 2026-10-01T08:00"}
        end: {type: string, description: ISO 8601 date or local datetime (exclusive).}
        query: {type: string, description: Optional free-text search.}
        max_results: {type: integer}
      required: [start, end]

  - name: calendar_create_event
    kind: builtin
    handler: calendar_create_event
    requires: google
    roles: ["*"]
    description: >-
      Create an event on the current person's own Google Calendar. Dates only (YYYY-MM-DD) make an
      all-day event (end is exclusive). Confirm title and time with the person if anything is ambiguous.
    input_schema:
      type: object
      properties:
        summary: {type: string}
        start: {type: string, description: ISO 8601 local datetime or date.}
        end: {type: string, description: ISO 8601 local datetime or date.}
        description: {type: string}
        location: {type: string}
      required: [summary, start, end]

  - name: calendar_update_event
    kind: builtin
    handler: calendar_update_event
    requires: google
    roles: ["*"]
    description: Change an event on the current person's own calendar (by id from calendar_list_events). Only pass fields that change.
    input_schema:
      type: object
      properties:
        event_id: {type: string}
        summary: {type: string}
        start: {type: string}
        end: {type: string}
        description: {type: string}
        location: {type: string}
      required: [event_id]

  - name: calendar_delete_event
    kind: builtin
    handler: calendar_delete_event
    requires: google
    roles: ["*"]
    description: >-
      Delete an event from the current person's own calendar. Only after they explicitly confirmed
      this specific event in the conversation.
    input_schema:
      type: object
      properties:
        event_id: {type: string}
        confirmed_by_user: {type: boolean, description: Must be true.}
      required: [event_id, confirmed_by_user]

  # ---------------------------------------------------------------- n8n REST API (admin)
  - name: n8n_list_workflows
    kind: n8n_api
    action: list_workflows
    roles: [admin, cofounder]
    description: List n8n workflows (id, name, active, tags).
    input_schema:
      type: object
      properties:
        active: {type: boolean, description: Only active / only inactive workflows.}

  - name: n8n_get_workflow
    kind: n8n_api
    action: get_workflow
    roles: [admin, cofounder]
    description: Get one n8n workflow's full definition (nodes, connections, settings).
    input_schema:
      type: object
      properties:
        workflow_id: {type: string}
      required: [workflow_id]

  - name: n8n_create_workflow
    kind: n8n_api
    action: create_workflow
    roles: [admin]
    description: >-
      Create a new n8n workflow. `workflow` must be an n8n workflow object with
      name, nodes, connections and settings. Created inactive.
    input_schema:
      type: object
      properties:
        workflow: {type: object}
      required: [workflow]

  - name: n8n_update_workflow
    kind: n8n_api
    action: update_workflow
    roles: [admin]
    description: Replace an n8n workflow's definition (name, nodes, connections, settings).
    input_schema:
      type: object
      properties:
        workflow_id: {type: string}
        workflow: {type: object}
      required: [workflow_id, workflow]

  - name: n8n_set_workflow_active
    kind: n8n_api
    action: set_active
    roles: [admin]
    description: Activate or deactivate an n8n workflow.
    input_schema:
      type: object
      properties:
        workflow_id: {type: string}
        active: {type: boolean}
      required: [workflow_id, active]

  - name: n8n_delete_workflow
    kind: n8n_api
    action: delete_workflow
    roles: [admin]
    destructive: true
    description: >-
      Permanently delete an n8n workflow. Destructive: only do this when the user has
      explicitly confirmed the specific workflow in this conversation.
    input_schema:
      type: object
      properties:
        workflow_id: {type: string}
        confirmed_by_user: {type: boolean, description: Must be true — the user explicitly confirmed.}
      required: [workflow_id, confirmed_by_user]

  - name: n8n_list_executions
    kind: n8n_api
    action: list_executions
    roles: [admin, cofounder]
    description: List recent n8n executions, optionally for one workflow or status.
    input_schema:
      type: object
      properties:
        workflow_id: {type: string}
        status: {type: string, enum: [success, error, waiting, running, canceled]}
        limit: {type: integer, description: "Default 10, max 50."}

  - name: n8n_get_execution
    kind: n8n_api
    action: get_execution
    roles: [admin, cofounder]
    description: Get details of one n8n execution, including its data.
    input_schema:
      type: object
      properties:
        execution_id: {type: string}
      required: [execution_id]

  - name: n8n_trigger_webhook
    kind: n8n_api
    action: trigger_webhook
    roles: [admin, cofounder]
    description: >-
      Call any n8n Webhook-trigger path directly (POST {N8N_BASE_URL}/webhook/<path>).
      Use for ad-hoc testing of workflows that don't have their own tool entry yet.
    input_schema:
      type: object
      properties:
        path: {type: string, description: Webhook path, without the /webhook/ prefix.}
        payload: {type: object}
        test: {type: boolean, description: Use /webhook-test/ (workflow open in the editor, not active).}
      required: [path]

  # ---------------------------------------------------------------- n8n webhook tools
  # Phase 2 end-to-end proof. Import infra/n8n/alfred-echo.workflow.json into n8n
  # and activate it; this tool then round-trips through n8n.
  - name: echo_test
    kind: n8n_webhook
    webhook_path: alfred-echo
    async: false
    roles: ["*"]
    description: Diagnostic — sends a message through n8n and returns n8n's echo. Use when asked to test n8n.
    input_schema:
      type: object
      properties:
        message: {type: string}
      required: [message]
