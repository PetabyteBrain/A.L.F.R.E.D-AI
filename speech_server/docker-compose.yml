# Runs on the GPU box (e.g. a Jetson, ~/alfred-speech). Reachable only on its tailnet IP; Alfred
# calls it with SPEECH_TOKEN (in .env next to this file).
services:
  speech:
    build: .
    image: alfred-speech:latest
    container_name: alfred-speech
    runtime: nvidia
    restart: unless-stopped
    env_file: .env
    ports:
      - "${SPEECH_BIND:?set SPEECH_BIND (the tailnet IP to listen on) in .env}:8770:8770"
    volumes:
      - ./models:/models          # Whisper / Kokoro weights, downloaded once
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 180s
