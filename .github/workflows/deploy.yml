name: Deploy

on:
  push:
    branches: [main]
    # Documentation-only pushes don't restart Alfred (start a run by hand if one should).
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Check the tailnet connection
        # The action can finish "green" after every `tailscale up` attempt failed; stop here with the reason.
        run: |
          if ! tailscale status >/dev/null 2>&1; then
            echo "::error::The runner did not join the tailnet. Check the Tailscale OAuth client (scope auth_keys: write, tag:ci) and the TS_OAUTH_* secrets (infra/README-deploy.md)."
            exit 1
          fi

      - name: Upload the commit to ~/jarvis
        # Tailscale SSH (the access policy lets tag:ci in as the deploy user; no key to manage).
        # Extracting over the folder keeps the server-only files (.env, data/, homelab.yaml, company_profile.md, banner).
        run: |
          git archive --format=tar HEAD | ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p ~/jarvis && tar -x -C ~/jarvis"

      - name: Build, restart and health-check
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/jarvis
          [ -f .env ] || { echo "~/jarvis/.env is missing"; exit 1; }
          # compose bind-mounts this file; without it Docker would create a directory in its place
          [ -e orchestrator/homelab.yaml ] || cp orchestrator/homelab.example.yaml orchestrator/homelab.yaml
          docker compose up -d --build
          docker image prune -f >/dev/null
          port=$(sed -n 's/^ALFRED_PORT=//p' .env | tr -d '"\r')
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:${port:-8000}/healthz" >/dev/null; then
              echo "Alfred is healthy"; exit 0
            fi
            sleep 2
          done
          docker compose logs --tail 50 alfred
          echo "Health check failed"; exit 1
          REMOTE
