name: Build & publish (GHCR → Argo CD)

# Pull-based GitOps: push to main → test → build the arm64 image → push to GHCR →
# write the new tag into deploy/kustomization.yaml. Argo CD (in the cluster, behind the
# Cloudflare tunnel, no inbound access) sees the commit and rolls the Deployment.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/**"        # the tag-bump commit below must not retrigger the build
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/petabytebrain/alfred

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GHCR with the built-in GITHUB_TOKEN
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3          # arm64 emulation on the amd64 runner
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64                   # every cluster worker is arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commit the new image tag back
    steps:
      - uses: actions/checkout@v5
      - name: Pin the deployed image to this commit
        run: |
          sed -i -E "s|(newTag:).*|\1 ${GITHUB_SHA}|" deploy/kustomization.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "no tag change"; exit 0; fi
          git commit -am "deploy: alfred image ${GITHUB_SHA} [skip ci]"
          git push
