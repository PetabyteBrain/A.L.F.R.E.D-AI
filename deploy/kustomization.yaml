apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Argo CD watches this path. Only the generic workload objects live here; the namespace,
# Secrets (alfred-env, alfred-ops), the homelab ConfigMap, the data PVC and the public Ingress
# are created out-of-band and never committed (public-repo hygiene + secrets out of git).
namespace: apps
resources:
  - deployment.yaml
  - service.yaml
images:
  - name: ghcr.io/petabytebrain/alfred
    newTag: f21a501bd01fe6b7adae0cb91f85d5483a24a0cd
